# Tienda de Coucou: de dónde conviene instalar cada app (y su paquete nativo, si no se adivina solo).
#
#   <id de Flathub>  <preferido>  <paquete de los repositorios>  <paquete del AUR>
#
# preferido: flathub | repo | aur   ("-" = Flathub, salvo que no esté en Flathub)
# Un paquete "-" = no hay (o se busca solo: los de los repositorios salen del catálogo AppStream de
# Arch; los del AUR, por nombre, solo si su sitio web es el mismo que el de Flathub).
# Las apps que no están aquí se ofrecen de las dos formas y "Obtener" usa Flathub.
#
# AnyDesk: el de Flathub se cuelga al abrir (no puede cargar sus imágenes dentro de Flatpak), no tiene
# el servicio que permite conectarse sin nadie frente al equipo y solo tiene permiso de X11. El
# nativo (AUR) trae su servicio y anda en la sesión "Xfce (X11)".
com.anydesk.Anydesk       aur      -          anydesk-bin
com.visualstudio.code     aur      -          visual-studio-code-bin
com.discordapp.Discord    repo     discord    -
org.videolan.VLC          repo     vlc        -
com.valvesoftware.Steam   repo     steam      -
com.spotify.Client        flathub  -          spotify
com.google.Chrome         aur      -          google-chrome
com.microsoft.Edge        aur      -          microsoft-edge-stable-bin
org.mozilla.firefox       repo     firefox    -
org.telegram.desktop      repo     telegram-desktop -
