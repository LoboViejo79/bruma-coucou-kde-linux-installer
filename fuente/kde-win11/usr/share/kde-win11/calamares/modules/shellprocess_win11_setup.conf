# Instala el aspecto de Windows 11 (paquete kde-win11) en el sistema nuevo y lo deja aplicado:
#   - el paquete es obligatorio: si no se puede instalar, la instalación se detiene con el error
#     (las dependencias —SDDM, Kvantum, Flatpak…— se descargan de los repositorios de CachyOS)
#   - la cuenta creada queda con todo el aspecto ya aplicado (no espera al primer inicio de sesión)
#   - menú de arranque estilo Windows (GRUB o Limine)
---
dontChroot: false
timeout: 1800
script:
  - "pacman -U --noconfirm --needed /var/cache/kde-win11/*.pkg.tar.zst"
  - "pacman -Q kde-win11"
  # -f reemplaza el alias display-manager.service que dejó el módulo displaymanager
  - "systemctl enable -f sddm.service"
  - "-systemctl disable plasmalogin.service"
  # Si fallara, win11-firstrun lo aplica en el primer inicio de sesión
  - "-/usr/bin/win11-install-user"
  - "-/usr/bin/win11-bootmenu"
  - "rm -rf /var/cache/kde-win11"
i18n:
  name: "Installing the Windows 11 look"
  name[es]: "Instalando el aspecto de Windows 11"
