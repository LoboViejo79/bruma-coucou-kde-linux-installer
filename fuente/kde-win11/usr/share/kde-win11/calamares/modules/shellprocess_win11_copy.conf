# Copia los paquetes de Windows 11 de la ISO al sistema nuevo (fuera del chroot: ${ROOT} es el destino)
---
dontChroot: true
timeout: 600
script:
  - "mkdir -p ${ROOT}/var/cache/kde-win11"
  - "cp /usr/share/kde-win11-iso/repo/*.pkg.tar.zst ${ROOT}/var/cache/kde-win11/"
i18n:
  name: "Copying the Windows 11 look"
  name[es]: "Copiando el aspecto de Windows 11"
